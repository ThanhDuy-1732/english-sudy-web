<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2c1f4a" />
    <title>Đang ngoại tuyến · ThankZ English</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #2c1f4a;
        color: #fff;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      main {
        width: min(100%, 560px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 28px;
        padding: clamp(24px, 7vw, 44px);
        background: #3a2a61;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
      }
      p { color: #d5cfea; line-height: 1.7; }
      h1 { margin-top: 0; font-family: Georgia, serif; font-size: clamp(2rem, 9vw, 3.5rem); }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
      a {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 10px 18px;
        background: #fff;
        color: #2c1f4a;
        font-weight: 700;
        text-decoration: none;
      }
      a.secondary { background: #7f56d9; color: #fff; }
      a:focus-visible { outline: 3px solid #d9ecff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p>ThankZ English</p>
      <h1>Bạn đang ngoại tuyến</h1>
      <p>
        Bạn có thể ôn từ đã lưu, đọc ngữ pháp và viết nháp khi các trang đã được tải về. Sinh nội dung, hội thoại AI và chấm bài cần kết nối mạng.
      </p>
      <nav aria-label="Điều hướng ngoại tuyến">
        <a href="/">Thử lại</a>
        <a class="secondary" href="/history">Mở lịch sử</a>
        <a class="secondary" href="/review">Ôn tập</a>
        <a class="secondary" href="/grammar">Ngữ pháp</a>
        <a class="secondary" href="/write">Viết nháp</a>
      </nav>
    </main>
  </body>
</html>
